[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medguardx-core"
version = "1.0.1"
description = "Context-aware PII/PHI detection and masking engine for healthcare data. Stateless, model-configurable, framework-agnostic."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Adarsh Dwivedi", email = "23ucs509@lnmiit.ac.in" }]
keywords = ["pii", "phi", "healthcare", "masking", "anonymization", "presidio", "hipaa", "dpdp", "gdpr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "spacy>=3.7,<3.9",
]

# The engine is model-agnostic: after install, choose any spaCy English pipeline
# with `python -m spacy download en_core_web_{sm,md,lg,trf}` and pass its name to
# EngineConfig(model=...). Model wheels are NOT declared as dependencies because
# PyPI forbids direct-URL requirements and spaCy models are not on PyPI. The
# transformer model (en_core_web_trf) pulls its own runtime (spacy-curated-
# transformers + torch) when downloaded, so no transformer extra is needed.
[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/adarshcod30/MedGuardX"
Repository = "https://github.com/adarshcod30/MedGuardX"
Issues = "https://github.com/adarshcod30/MedGuardX/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/medguardx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
