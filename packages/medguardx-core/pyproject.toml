[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medguardx-core"
version = "1.0.0"
description = "Context-aware PII/PHI detection and masking engine for healthcare data. Stateless, model-configurable, framework-agnostic."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Adarsh Dwivedi" }]
keywords = ["pii", "phi", "healthcare", "masking", "anonymization", "presidio", "hipaa", "dpdp", "gdpr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "spacy>=3.7,<3.9",
]

# The masking engine itself is model-agnostic. The spaCy model is chosen by the
# integrator via an extra so nothing heavy is pulled in by default. Our own
# deployment uses [md]; anyone can pick sm / md / lg / trf.
[project.optional-dependencies]
sm = ["en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"]
md = ["en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl"]
lg = ["en_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl"]
trf = [
    "en_core_web_trf @ https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl",
    "spacy-transformers>=1.3",
]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.urls]
Homepage = "https://github.com/adarshcod30/MedGuardX"
Repository = "https://github.com/adarshcod30/MedGuardX"

[tool.hatch.metadata]
# The model extras reference spaCy model wheels by direct URL.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/medguardx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
