[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medguardx-api"
version = "1.0.0"
description = "Hardened FastAPI service wrapping the MedGuardX masking engine: enforced JWT auth, pluggable storage, encrypted-at-rest records, and audit."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

dependencies = [
    "medguardx-core",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]==1.7.4",
    "bcrypt<4.0.0",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    # ingestion extras used by the upload route
    "pdfplumber>=0.10",
    "pytesseract>=0.3.13",
    "Pillow>=10.0",
    "hl7apy>=1.3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["medguardx_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
