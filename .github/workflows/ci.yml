name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core library (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core (with dev deps)
        run: pip install -e "packages/medguardx-core[dev]"
      - name: Unit tests (no model required)
        run: pytest -q
        working-directory: packages/medguardx-core

  api:
    name: api service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core + api
        run: |
          pip install -e "packages/medguardx-core[dev]"
          pip install -e "apps/api[dev]"
      - name: API tests (stub engine, no model)
        run: pytest -q
        working-directory: apps/api

  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
